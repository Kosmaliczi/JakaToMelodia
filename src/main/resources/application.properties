# ==========================================================
# KONFIGURACJA SERWERA I SESJI
# ==========================================================
server.port=8080
# Bez `server.servlet.session.cookie.domain` — pozwalamy ciastku przykleić się
# do hostname, którego użyła przeglądarka (localhost, 127.0.0.1, LAN IP, prod domain).
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=lax
# Secure flag: w prod (HTTPS) zostaw true. W lokalnym dev pod HTTP nadpisz na false.
server.servlet.session.cookie.secure=${MELODIA_COOKIE_SECURE:false}

# Spring respektuje X-Forwarded-* od reverse proxy (Caddy/nginx/ALB).
# Bez tego OAuth2 wygenerowałby redirect http:// zamiast https:// za proxy.
server.forward-headers-strategy=framework

spring.application.name=melodia-wolfship

# ==========================================================
# KONFIGURACJA OAUTH2 SPOTIFY
# Sekrety MUSZĄ być podane jako zmienne środowiskowe — NIE commituj plaintext.
# ==========================================================
spring.security.oauth2.client.registration.wolfship-auth.client-id=${SPOTIFY_CLIENT_ID:}
spring.security.oauth2.client.registration.wolfship-auth.client-secret=${SPOTIFY_CLIENT_SECRET:}
spring.security.oauth2.client.registration.wolfship-auth.scope=user-read-private,user-read-email,playlist-read-private,playlist-read-collaborative,streaming,user-read-playback-state,user-modify-playback-state
spring.security.oauth2.client.registration.wolfship-auth.authorization-grant-type=authorization_code
# {baseUrl} = schemat + host + port skąd przyszło żądanie. Dzięki temu działa
# zarówno lokalnie (http://127.0.0.1:8080) jak i prod (https://twoja-domena.pl).
# WAŻNE: KAŻDY adres MUSI być zarejestrowany w Spotify Developer Dashboard.
spring.security.oauth2.client.registration.wolfship-auth.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.wolfship-auth.provider=spotify-provider

spring.security.oauth2.client.provider.spotify-provider.authorization-uri=https://accounts.spotify.com/authorize
spring.security.oauth2.client.provider.spotify-provider.token-uri=https://accounts.spotify.com/api/token

# Adres docelowy po udanym logowaniu. Relatywny "/" — zostajemy na hoście
# z którego przyszło żądanie (LAN/prod-friendly).
app.oauth2.success-redirect-uri=${OAUTH2_SUCCESS_REDIRECT:/}

# ==========================================================
# CZYSZCZENIE SESJI GIER
# ==========================================================
melodia.session.ttl-minutes=120
melodia.session.cleanup-interval-minutes=10

# ==========================================================
# JWT - autoryzacja graczy
# W prod USTAW MELODIA_JWT_SECRET (>=32 bajty losowe, najlepiej base64).
# Bez tego sekret jest generowany przy starcie i restart kontenera = wyrzucenie graczy.
# ==========================================================
melodia.jwt.secret=${MELODIA_JWT_SECRET:}
melodia.jwt.ttl-hours=4

# ==========================================================
# LAN HOST IP (dla widoku hosta — generowanie QR code dla graczy)
# W kontenerze Docker NetworkInterface widzi tylko bridge (172.x.x.x), nie WiFi
# hosta. Ustaw MELODIA_HOST_LAN_IP w .env na faktyczny IP twojej maszyny w sieci.
# Można podać kilka rozdzielonych przecinkiem (WiFi + Ethernet).
# Pusty = backend próbuje wykryć sam (działa tylko bare-metal).
# ==========================================================
melodia.host-lan-ip=${MELODIA_HOST_LAN_IP:}

# ==========================================================
# LOGOWANIE I FORMATOWANIE
# ==========================================================
spring.jackson.serialization.indent-output=true
logging.level.root=INFO
logging.level.com.wolfship.melodia=${MELODIA_LOG_LEVEL:DEBUG}
