# ==========================================================
# KONFIGURACJA SERWERA I SESJI
# ==========================================================
server.port=8080
server.servlet.session.cookie.domain=127.0.0.1
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=lax

spring.application.name=melodia-wolfship

# ==========================================================
# KONFIGURACJA OAUTH2 SPOTIFY
# Sekrety podawaj jako zmienne srodowiskowe SPOTIFY_CLIENT_ID i SPOTIFY_CLIENT_SECRET.
# ==========================================================
spring.security.oauth2.client.registration.wolfship-auth.client-id=b495b3aa94fb4f47bf5ead8a72f57180
spring.security.oauth2.client.registration.wolfship-auth.client-secret=3fa2a2bdcd764d66929ac1f5aefc2955
spring.security.oauth2.client.registration.wolfship-auth.scope=user-read-private,user-read-email,playlist-read-private,playlist-read-collaborative,streaming,user-read-playback-state,user-modify-playback-state
spring.security.oauth2.client.registration.wolfship-auth.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.wolfship-auth.redirect-uri=http://127.0.0.1:8080/login/oauth2/code/wolfship-auth
spring.security.oauth2.client.registration.wolfship-auth.provider=spotify-provider

spring.security.oauth2.client.provider.spotify-provider.authorization-uri=https://accounts.spotify.com/authorize
spring.security.oauth2.client.provider.spotify-provider.token-uri=https://accounts.spotify.com/api/token

# Adres na ktory wracamy po udanym logowaniu (front lub /api/playlists do testow)
app.oauth2.success-redirect-uri=${OAUTH2_SUCCESS_REDIRECT:http://127.0.0.1:8080/}

# ==========================================================
# CZYSZCZENIE SESJI GIER
# ==========================================================
melodia.session.ttl-minutes=120
melodia.session.cleanup-interval-minutes=10

# ==========================================================
# JWT - autoryzacja graczy (0.2 Faza 2)
# Sekret podaj jako zmienna srodowiskowa MELODIA_JWT_SECRET (>=32 bajty).
# Pusty oznacza generowanie ulotnego sekretu przy starcie (DEV).
# ==========================================================
melodia.jwt.secret=${MELODIA_JWT_SECRET:}
melodia.jwt.ttl-hours=4

# ==========================================================
# LOGOWANIE I FORMATOWANIE
# ==========================================================
spring.jackson.serialization.indent-output=true
logging.level.root=INFO
logging.level.com.wolfship.melodia=DEBUG
