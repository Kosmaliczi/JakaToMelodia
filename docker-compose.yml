services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jaka-to-melodia:latest
    container_name: jaka-to-melodia
    ports:
      # 0.0.0.0:8080 — dostępne z LAN. Aby ograniczyć tylko do localhost,
      # zmień na "127.0.0.1:8080:8080".
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xmx512m -XX:+UseG1GC -XX:MaxRAMPercentage=75"

      # OAuth2 success redirect — relatywny "/" oznacza "ten sam host:port".
      OAUTH2_SUCCESS_REDIRECT: "/"

      # ── Spotify credentials (WYMAGANE — bez tego /login zwróci błąd) ─────
      # Trzymaj je w pliku .env (NIE commituj). Compose czyta .env automatycznie.
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID}"
      SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET}"

      # ── JWT (opcjonalne) ────────────────────────────────────────────────
      # Bez tego sekret jest generowany przy starcie → restart = wyrzucenie graczy.
      MELODIA_JWT_SECRET: "${MELODIA_JWT_SECRET:-}"

      # ── LAN host IP (dla QR code w lobby) ──────────────────────────────
      # Kontener nie widzi WiFi hosta — backend potrzebuje wiedzieć ten IP
      # by wstawić go w QR code linku /join. Ustaw w .env (np. 192.168.1.50).
      MELODIA_HOST_LAN_IP: "${MELODIA_HOST_LAN_IP:-}"

      # Lokalnie HTTP — nie wymuszaj Secure cookie. W prod (HTTPS) ustaw true.
      MELODIA_COOKIE_SECURE: "${MELODIA_COOKIE_SECURE:-false}"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -n > /dev/tcp/localhost/8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
